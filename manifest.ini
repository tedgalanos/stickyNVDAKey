name = "stickyNVDAKey"
summary = "Sticky NVDA Key"
description = "Makes the NVDA modifier key (Insert, Numpad Insert, or Caps Lock) sticky, like JAWS Insert Key Mode, without needing Windows Sticky Keys. Press Insert once, release it, then press the next key. Press Insert twice to lock it, and press it again to unlock."
author = "Ted Galanos"
version = "1.0.0"
minimumNVDAVersion = "2024.1"
lastTestedNVDAVersion = "2026.3"
